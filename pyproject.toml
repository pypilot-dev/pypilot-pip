[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypilot-cli"
version = "1.2.2"
description = "Deterministic Python environment doctor, dependency solver, and hardware compatibility manager."
readme = "README.md"
requires-python = ">=3.8"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Abdullah Masood", email = "Abdullah-Masood-05@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pypilot-dev/pypilot"
Repository = "https://github.com/pypilot-dev/pypilot"
Issues = "https://github.com/pypilot-dev/pypilot/issues"

[project.scripts]
pypilot = "pypilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "hatchling>=1.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pypilot"]

# Bundles the engine when PYPILOT_ENGINE_ASSET is set (scripts/build_wheels.py);
# otherwise the wheel stays pure Python.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"


[tool.pytest.ini_options]
markers = ["network: downloads the real engine from GitHub"]
